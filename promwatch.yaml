version: "1"
log_level: INFO                                  # Logging level (DEBUG, INFO, WARN, ERROR)
log_format: json                                 # Log format (text, json)
work_dir: /promwatch                             # Working directory
config_output_path: /promwatch/prometheus.yml    # Output path for Prometheus config
reload_url: http://prometheus:9090/-/reload      # URL to trigger Prometheus reload
pull_interval_seconds: 60                        # Interval between pulls (seconds)
poll_jitter_seconds: 10                          # Random jitter to add (seconds)
secure_logging: true                             # Mask sensitive information in logs
source_priority: GIT,HTTP,KUBERNETES             # Order of source priority
prometheus_target: prometheus:9090               # Default Prometheus target for placeholder mode
promwatch_target: promwatch:8080                 # Default PromWatch target for placeholder mode

scrape_configs:
  - job_name: promwatch
    static_configs:
      - targets: ['promwatch:8080']

defaults_repo:
  repo: git@github.com:alekslector/prim-mc.git
  branch: defaults
  auth:
    type: ssh
    key_env: ${PROMWATCH_DEFAULTS_SSH_KEY_CONTENT}  

sources:
  git_sources:
    - name: team1                         # Friendly name (required)
      repo: git@github.com:alekslector/prim-mc.git
      branch: team1                                 # Branch to use (default: main)
      auth:
        type: ssh
        key_env: ${PROMWATCH_DEFAULTS_SSH_KEY_CONTENT}                       # Reference to environment variable for SSH key
        # OR use key_path for a file with the SSH key
        # key_path: /path/to/ssh/key

    - name: team2                         # Friendly name (required)
      repo: git@github.com:alekslector/prim-mc.git
      branch: team2                                 # Branch to use (default: main)
      auth:
        type: ssh
        key_env: ${PROMWATCH_DEFAULTS_SSH_KEY_CONTENT}                       # Reference to environment variable for SSH key
        # OR use key_path for a file with the SSH key
        # key_path: /path/to/ssh/key
