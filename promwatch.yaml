version: "1"
log_level: INFO
log_format: json
work_dir: /promwatch
config_output_path: /promwatch/prometheus.yml
reload_url: http://prometheus:9090/-/reload
pull_interval_seconds: 60
poll_jitter_seconds: 10
secure_logging: false
source_priority: GIT,HTTP,KUBERNETES
prometheus_target: prometheus:9090
promwatch_target: promwatch:8080
enable_duplication_tiers: true

sources:
  git_sources:
    - name: team1
      repo: git@github.com:alekslector/prim-mc.git
      branch: team1
      auth:
        type: ssh
        key_env: PROMWATCH_DEFAULTS_SSH_KEY_CONTENT
    
    - name: team2
      repo: git@github.com:alekslector/prim-mc.git
      branch: team2
      auth:
        type: ssh
        key_env: PROMWATCH_DEFAULTS_SSH_KEY_CONTENT

duplication_tiers:
  - name: low_resolution
    label_key: "tier"
    label_value: "high"
    interval: "10m"
  
  - name: medium_resolution
    label_key: "tier"
    label_value: "medium"
    interval: "3m"

remote_write:
  - name: high_resolution_storage
    url: "https://prometheus-remote-highres.example.com/write"
    write_relabel_configs:
    - source_labels: [tier]  
      regex: high
      action: keep
  
  - name: medium_resolution_storage
    url: "https://prometheus-remote-mediumres.example.com/write"
    write_relabel_configs:
    - source_labels: [tier]  
      regex: medium
      action: keep
  
  - name: raw_metrics_storage
    url: "https://prometheus-remote-all.example.com/write"


alerting:
  alertmanagers:
    - kubernetes_sd_configs:
        - role: pod
          namespaces:
            names:
              - monitoring
          selectors:
            - role: pod
              label: "app=alertmanager"
      relabel_configs:
        - source_labels: [__meta_kubernetes_pod_label_component]
          regex: alertmanager
          action: keep
        - source_labels: [__meta_kubernetes_pod_container_port_number]
          regex: 9093
          action: keep