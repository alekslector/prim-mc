version: "1"
log_level: INFO
log_format: json
work_dir: /promwatch
config_output_path: /promwatch/prometheus.yml
reload_url: http://prometheus:9090/-/reload
pull_interval_seconds: 60
poll_jitter_seconds: 10
secure_logging: true
source_priority: GIT,HTTP,KUBERNETES
prometheus_target: prometheus:9090
promwatch_target: promwatch:8080

sources:
  git_sources:
    - name: team1
      repo: git@github.com:alekslector/prim-mc.git
      branch: team1
      auth:
        type: ssh
        key_env: PROMWATCH_DEFAULTS_SSH_KEY_CONTENT
    
    - name: team2
      repo: git@github.com:alekslector/prim-mc.git
      branch: team2
      auth:
        type: ssh
        key_env: PROMWATCH_DEFAULTS_SSH_KEY_CONTENT

duplication_tiers:
  - name: high_resolution
    label_key: "tier"
    label_value: "high"

remote_write:
  - name: long_term_storage
    url: "https://prometheus-remote.example.com/write"
    queue_config:
      capacity: 10000
      max_shards: 200
    write_relabel_configs:
    - source_labels: tier
      regex: high
      action: keep